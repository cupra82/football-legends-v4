name: V4 - Amplia Mondiali ed Europei (archivio storico)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v4-historical-archive
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlla il generatore su esempi verificabili
        run: node scripts/test-competition-history.js
      - name: Genera domande su Mondiali ed Europei da OpenFootball
        env:
          FL_HISTORY_BUDGET_MS: '150000'
        run: node scripts/build-competition-history.js
      - name: Verifica conteggi e formati
        run: node scripts/audit-categories.js
      - name: Pubblica soltanto archivi modificati
        run: |
          git config user.name 'football-legends-v4-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition-history-generated.json category-report.json category-report.md
          if ! git diff --cached --quiet; then
            git commit -m 'V4: amplia archivio storico competizioni'
            git push
          else
            echo 'Nessuna nuova domanda / nessuna modifica da pubblicare'
          fi
