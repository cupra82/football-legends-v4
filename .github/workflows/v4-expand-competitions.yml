name: V4 - MEGA archivio unico (coppe, stadi, leggende e premi)
on:
  workflow_dispatch:
  schedule:
    - cron: '40 6 * * 1'
permissions:
  contents: write
concurrency:
  group: v4-historical-archive
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testa entrambi i generatori storici
        run: |
          node scripts/test-competition-history.js
          node scripts/test-european-cups.js
      - name: Genera Mondiali ed Europei
        env:
          FL_HISTORY_BUDGET_MS: '200000'
        run: node scripts/build-competition-history.js
      - name: Genera Champions, Europa League e Conference League
        env:
          FL_CUP_BUDGET_MS: '300000'
        run: node scripts/build-european-cups.js
      - name: Integra stadi, derby, leggende e premi curati
        run: node scripts/build-themed-archive.js
      - name: Scopri nuovi stadi dai club Wikidata (limiti e checkpoint)
        env:
          FL_STADIUM_BUDGET_MS: '160000'
          FL_STADIUM_CLUBS_PER_RUN: '500'
        run: node scripts/build-v4-stadiums.js
      - name: Verifica categorie e formati
        run: node scripts/audit-categories.js
      - name: Riepilogo per categoria
        run: |
          node - <<'JS'
          const r=require('./category-report.json');
          console.log('DOMANDE VALIDE TOTALE:',r.validUniquePlayable);
          for(const c of r.categories.filter(x=>['Mondiali','Europei','Champions League','Coppe europee','Stadi leggendari','Derby e rivalità','Leggende del calcio','Pallone d’Oro'].includes(x.category)))console.log(c.category, c.available);
          JS
      - name: Pubblica SOLO le domande effettivamente modificate
        run: |
          git config user.name 'football-legends-v4-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition-history-generated.json european-cups-generated.json themed-generated.json stadiums-wikidata-generated.json stadiums-wikidata-progress.json category-report.json category-report.md
          if ! git diff --cached --quiet; then
            git commit -m 'V4: archivio storico integrato coppe e nazionali'
            git pull --rebase origin main
            git push
          else
            echo 'Nessuna nuova domanda / dati già aggiornati'
          fi
