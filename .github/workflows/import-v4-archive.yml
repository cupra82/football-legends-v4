name: V4 - Verifica archivi importati (non sovrascrive)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlla che gli archivi grandi siano presenti
        run: node scripts/release-preflight.js --strict
